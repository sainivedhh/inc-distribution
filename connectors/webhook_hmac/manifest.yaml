key: webhook_hmac
version: 1.0.0
tier: bridge
auth: hmac
surfaces:
  - key: webhook
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 500
      body_max_chars: 100000
      links_allowed: true
      media_types_allowed: [image, video]
      max_media_count: 20
rate_limits:
  per_connection:
    requests: 120
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "410": CONNECTION_AUTH_EXPIRED
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
