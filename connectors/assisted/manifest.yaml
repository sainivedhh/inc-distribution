key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: manual_pack
    content_types: [text, image, video]
    spec:
      title_max_chars: 500
      body_max_chars: 20000
      links_allowed: true
      media_types_allowed: [image, video]
      max_media_count: 10
rate_limits:
  per_connection:
    requests: 1000
    per_seconds: 60
capabilities: [assist_pack]
error_map: {}
