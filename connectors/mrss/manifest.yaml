key: mrss
version: 1.0.0
tier: feed
auth: none
surfaces:
  - key: video_feed
    content_types: [video, text]
    spec:
      title_max_chars: 200
      body_max_chars: 5000
      links_allowed: true
      media_types_allowed: [video]
      max_media_count: 1
rate_limits:
  per_connection:
    requests: 300
    per_seconds: 60
capabilities: [publish, status, delete]
error_map: {}
