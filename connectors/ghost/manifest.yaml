key: ghost
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: post
    content_types: [text, image]
    spec:
      title_max_chars: 255
      body_max_chars: 500000
      links_allowed: true
      media_types_allowed: [image]
      max_media_count: 50
rate_limits:
  per_connection:
    requests: 60
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "500": PLATFORM_UNAVAILABLE
instance_param: base_url
