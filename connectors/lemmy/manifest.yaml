key: lemmy
version: 1.0.0
tier: protocol
auth: api_key
surfaces:
  - key: post
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 200
      body_max_chars: 10000
      links_allowed: true
      media_types_allowed: [image, video]
      max_media_count: 5
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "400": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "429": PLATFORM_RATE_LIMIT
  "500": PLATFORM_UNAVAILABLE
instance_param: base_url
