version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_distribution_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - HOST=0.0.0.0
      - SIMULATION_MODE=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/distribution
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=incubrix-distribution
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_distribution_worker
    restart: unless-stopped
    command: ["python", "-m", "core.worker"]
    environment:
      - ENVIRONMENT=development
      - SIMULATION_MODE=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/distribution
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=incubrix-distribution
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    container_name: incubrix_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=distribution
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: incubrix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: incubrix_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Mock server for platforms (Discourse, Dev.to, Webhooks, Hashnode, Slack, etc.)
  mocks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_mocks
    restart: unless-stopped
    command: ["uvicorn", "mocks.server:mock_app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"

volumes:
  pgdata:
  minio_data:
